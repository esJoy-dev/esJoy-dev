<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1110" viewBox="0 0 1150 1110" role="img" aria-labelledby="title desc">
<title id="title">The LAB, cross-section</title>
<desc id="desc">A static-complete diagram of the LAB, a self-hosted local-first bench, reading top to bottom. Inside the local-only boundary at the top, a workstation runs automation, generation, and local-model services with agent lanes that build, verify, and rework; data and work stay on owner hardware, and findings live in runbooks as lessons rather than live endpoints. The flow then turns vertical: a user gate below the boundary holds all egress. An outbound request waits at the gate; the gate can decline it (amber) and the work returns to the bench for rework, or approve it (green), and only then does a streak cross the authenticated-gateway edge down to cloud models and web services — cloud work is daily and intentional, always through the gate. Results and lessons come home up the left side. A guard-blue security band runs beneath everything: audit-first probes before any change, loopback by default, unfixed findings never published. Animation is decorative; the diagram is complete without it.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061826"/><stop offset=".55" stop-color="#0e2a40"/><stop offset="1" stop-color="#122540"/></linearGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#3a6683" stroke-opacity=".16" stroke-width="1"/></pattern>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28516b" stop-opacity=".76"/><stop offset=".48" stop-color="#1a314b" stop-opacity=".78"/><stop offset="1" stop-color="#262b53" stop-opacity=".86"/></linearGradient>
 <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#4de8f5"/></marker>
 <marker id="violetArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b08cff"/></marker>
 <marker id="mintArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#56e7af"/></marker>
 <marker id="amberArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#ffb454"/></marker>
 <style>
  .fx{opacity:0;animation-duration:16s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  .cm{fill:none;stroke-linecap:round;animation-timing-function:linear}
  .kDome{animation-name:kDome}.kLanes{animation-name:kLanes}.kPkt{animation-name:kPkt}.kGate{animation-name:kGate}.kDeny{animation-name:kDeny}.kDec{animation-name:kDec}.kOk{animation-name:kOk}.kEg{animation-name:kEg}.kCloud{animation-name:kCloud}.kRet{animation-name:kRet}.kHome{animation-name:kHome}
  @keyframes kDome{0%{opacity:0}1.5%{opacity:.85}6%{opacity:.85}7.5%,100%{opacity:0}}
  @keyframes kLanes{0%,11.9%{opacity:0}13%{opacity:.85}20%{opacity:.85}21.3%,100%{opacity:0}}
  @keyframes kPkt{0%,13.5%{opacity:0;stroke-dashoffset:16}14.2%{opacity:1}15.8%{opacity:1}16.6%,100%{opacity:0;stroke-dashoffset:-19}}
  @keyframes kGate{0%,33%{opacity:0}34%{opacity:.9}48%{opacity:.9}49.5%,100%{opacity:0}}
  @keyframes kDeny{0%,37.5%{opacity:0}38.2%{opacity:1}44%{opacity:1}45%,100%{opacity:0}}
  @keyframes kDec{0%,38.5%{opacity:0;stroke-dashoffset:16}39.2%{opacity:1}45.5%{opacity:1}46.5%,100%{opacity:0;stroke-dashoffset:-217}}
  @keyframes kOk{0%,53%{opacity:0}53.7%{opacity:1}60%{opacity:1}61%,100%{opacity:0}}
  @keyframes kEg{0%,56.5%{opacity:0;stroke-dashoffset:12}57.2%{opacity:1}60.5%{opacity:1}61.3%,100%{opacity:0;stroke-dashoffset:-30}}
  @keyframes kCloud{0%,56%{opacity:0}57%{opacity:.85}63%{opacity:.85}64%,100%{opacity:0}}
  @keyframes kRet{0%,70%{opacity:0;stroke-dashoffset:26}71%{opacity:1}77%{opacity:1}78%,100%{opacity:0;stroke-dashoffset:-401}}
  @keyframes kHome{0%,78%{opacity:0}79%{opacity:.75}84%{opacity:.75}85%,100%{opacity:0}}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  .breathe{animation:breathe 4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.fx,.breathe{animation:none}}
 </style>
</defs>
