  @keyframes kL{0%,93.8%{opacity:0;stroke-dashoffset:34}94.2%{opacity:1}99.6%{opacity:1}100%{opacity:0;stroke-dashoffset:-1508}}
  @keyframes flowF{to{stroke-dashoffset:-34}}
