  @keyframes kVer{0%,24.4%{opacity:0}25.5%{opacity:.85}32.5%{opacity:.85}33.8%{opacity:0}68.1%{opacity:0}68.8%{opacity:.75}72.4%{opacity:.75}73.1%,100%{opacity:0}}
