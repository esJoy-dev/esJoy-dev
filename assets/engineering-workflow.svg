<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">My Engineering Loop</title>
<desc id="desc">Humans set direction in explore and architect. Agents run a delivery loop of implement and verify until clean, with findings looping back. A human approval gate stands between the loop and release; declined work reworks inside the loop. Release feeds an operate and learn arc back to direction. Security runs across every phase as a continuous band. Cyan shapes are agent-driven, mint shapes are human decisions, and flowing violet dashes are feedback and learning.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset=".55" stop-color="#10233b"/><stop offset="1" stop-color="#141a34"/></linearGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#3a6683" stroke-opacity=".16" stroke-width="1"/></pattern>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28516b" stop-opacity=".76"/><stop offset=".48" stop-color="#1a314b" stop-opacity=".78"/><stop offset="1" stop-color="#262b53" stop-opacity=".86"/></linearGradient>
 <linearGradient id="mintglass" x2="1" y2="1"><stop stop-color="#12554f" stop-opacity=".9"/><stop offset="1" stop-color="#113e48" stop-opacity=".9"/></linearGradient>
 <linearGradient id="edge" x2="1" y2="0"><stop stop-color="#4fe4f6"/><stop offset="1" stop-color="#a98bff"/></linearGradient>
 <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#4de8f5"/></marker>
 <marker id="violetArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b08cff"/></marker>
 <style>
  .flow{stroke-dasharray:9 8;animation:flow 3.2s linear infinite}
  .flowC{stroke-dasharray:12 7;animation:flowC 9s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-68}}
  @keyframes flowC{to{stroke-dashoffset:-76}}
  .pulse{animation:pulse 3.6s ease-in-out infinite}
  .breathe{animation:breathe 4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.06}50%{opacity:.22}}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){.flow,.flowC,.pulse,.breathe{animation:none}}
 </style>
</defs>
<rect x="5" y="5" width="1490" height="690" rx="28" fill="url(#bg)" stroke="#32617f" stroke-width="2"/>
<rect x="8" y="8" width="1484" height="684" rx="26" fill="url(#grid)"/>
<rect x="40" y="28" width="5" height="26" rx="2.5" fill="#45e5f5"/>
<text x="55" y="49" fill="#f0f7ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" letter-spacing="2">MY ENGINEERING LOOP</text>
<rect x="455" y="100" width="510" height="260" rx="26" fill="#1c2344" fill-opacity=".55" stroke="#b08cff" stroke-width="2"/>
<rect x="455" y="100" width="510" height="260" rx="26" fill="none" stroke="#b08cff" stroke-width="2" class="flowC"/>
<path d="M514 121c-4 0 -7 3 -7 6s3 6 7 6c6 0 11 -12 16 -12c4 0 7 3 7 6s-3 6 -7 6c-5 0 -10 -12 -16 -12z" fill="none" stroke="#b9a5ff" stroke-width="2.5" stroke-linecap="round" class="breathe"/>
<text x="547" y="133" fill="#d8c9ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="2">DELIVERY LOOP</text>
<rect x="790" y="112" width="150" height="28" rx="14" fill="#1c2344" stroke="#b08cff" stroke-width="1.3"/><text x="865" y="130" text-anchor="middle" fill="#d8c9ff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">RUNS UNTIL CLEAN</text>
<rect x="485" y="165" width="205" height="165" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.8"/>
<path d="M501 167h120" stroke="#d9f9ff" stroke-opacity=".4" stroke-width="2"/>
<text x="505" y="200" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">IMPLEMENT</text>
<path d="M646 185l-10 11 10 11 M664 185l10 11 -10 11 M658 182l-6 28" fill="none" stroke="#5de8ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="505" y="228" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="15">Build and wire the</text>
<text x="505" y="250" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="15">system in short,</text>
<text x="505" y="272" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="15">reviewable steps.</text>
<rect x="745" y="165" width="205" height="165" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.8"/>
<path d="M761 167h120" stroke="#d9f9ff" stroke-opacity=".4" stroke-width="2"/>
<text x="765" y="200" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold">VERIFY</text>
<rect x="890" y="177" width="30" height="30" rx="8" fill="none" stroke="#5de8ff" stroke-width="3.5"/><path d="M896 192l5 6 10 -11" fill="none" stroke="#5de8ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="765" y="228" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="15">Agents test, inspect,</text>
<text x="765" y="250" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="15">and review outputs —</text>
<text x="765" y="272" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="15">find what breaks.</text>
<path d="M690 208H743" fill="none" stroke="#4de8f5" stroke-width="2.5" marker-end="url(#cyanArrow)"/>
<path d="M745 285H692" fill="none" stroke="#b08cff" stroke-width="2.5" class="flow" marker-end="url(#violetArrow)"/>
<text x="717" y="305" text-anchor="middle" fill="#cdbdff" font-family="Arial, Helvetica, sans-serif" font-size="11">findings</text>
<rect x="55" y="130" width="330" height="200" rx="20" fill="url(#mintglass)" stroke="#56e7af" stroke-width="1.8"/>
<path d="M73 132h140" stroke="#d9f9ff" stroke-opacity=".4" stroke-width="2"/>
<rect x="75" y="150" width="100" height="26" rx="13" fill="#0f493f" stroke="#56e7af" stroke-width="1.4"/><text x="125" y="167" text-anchor="middle" fill="#b8ffe1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">HUMAN-LED</text>
<circle cx="315" cy="178" r="17" fill="none" stroke="#75efbd" stroke-width="3.5"/><path d="M315 165l6 13 -6 13 -6 -13z" fill="none" stroke="#75efbd" stroke-width="3.5" stroke-linejoin="round"/>
<text x="75" y="234" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">EXPLORE &amp; ARCHITECT</text>
<text x="75" y="264" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="16">Set direction: the problem,</text>
<text x="75" y="286" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="16">constraints, and system design.</text>
<path d="M385 230H453" fill="none" stroke="#4de8f5" stroke-width="3" marker-end="url(#cyanArrow)"/>
<path d="M965 230H1033" fill="none" stroke="#4de8f5" stroke-width="3" marker-end="url(#cyanArrow)"/>
<path d="M1105 148L1187 230 1105 312 1023 230Z" fill="#56e7af" class="pulse"/>
<path d="M1105 162L1173 230 1105 298 1037 230Z" fill="#0f3b34" stroke="#56e7af" stroke-width="2"/>
<circle cx="1105" cy="190" r="5.5" fill="none" stroke="#75efbd" stroke-width="3.5"/><path d="M1096 206c1.5 -4.5 4.5 -6.5 9 -6.5s7.5 2 9 6.5" fill="none" stroke="#75efbd" stroke-width="3.5" stroke-linecap="round"/>
<text x="1105" y="236" text-anchor="middle" fill="#b8ffe1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">HUMAN</text>
<text x="1105" y="254" text-anchor="middle" fill="#b8ffe1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" letter-spacing="1">APPROVAL</text>
<rect x="1250" y="130" width="195" height="200" rx="20" fill="url(#mintglass)" stroke="#56e7af" stroke-width="1.8"/>
<path d="M1268 132h120" stroke="#d9f9ff" stroke-opacity=".4" stroke-width="2"/>
<rect x="1268" y="150" width="100" height="26" rx="13" fill="#0f493f" stroke="#56e7af" stroke-width="1.4"/><text x="1318" y="167" text-anchor="middle" fill="#b8ffe1" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">HUMAN-LED</text>
<g fill="none" stroke="#75efbd" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1398 160c-8 8 -11 19 -11 27v10h22v-10c0 -8 -3 -19 -11 -27z"/><circle cx="1398" cy="182" r="5"/><path d="M1387 185l-9 11h9 M1409 185l9 11h-9"/><path d="M1395 197c1 3 2 6 3 8 1 -2 2 -5 3 -8"/></g>
<text x="1268" y="234" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold">RELEASE</text>
<text x="1268" y="264" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="15">Ship deliberately:</text>
<text x="1268" y="286" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="15">a human decides</text>
<text x="1268" y="308" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="15">every go-live.</text>
<path d="M1175 230H1248" fill="none" stroke="#4de8f5" stroke-width="3" marker-end="url(#cyanArrow)"/>
<text x="1212" y="220" text-anchor="middle" fill="#b8ffe1" font-family="Arial, Helvetica, sans-serif" font-size="11">approved</text>
<path d="M1105 298V375A10 10 0 0 1 1095 385H722A10 10 0 0 1 712 375V362" fill="none" stroke="#b08cff" stroke-width="2.5" class="flow" marker-end="url(#violetArrow)"/>
<text x="905" y="404" text-anchor="middle" fill="#cdbdff" font-family="Arial, Helvetica, sans-serif" font-size="11">REWORK — decline sends it back</text>
<path d="M1347 330V452A20 20 0 0 1 1327 472H120A20 20 0 0 1 100 452V332" fill="none" stroke="#b08cff" stroke-width="2.5" class="flow" marker-end="url(#violetArrow)"/>
<text x="712" y="462" text-anchor="middle" fill="#cdbdff" font-family="Arial, Helvetica, sans-serif" font-size="13">OPERATE → LEARN — the system teaches the next direction</text>
<rect x="40" y="505" width="1420" height="64" rx="16" fill="#162b43" fill-opacity=".93" stroke="#5be7b6" stroke-width="1.8"/>
<path d="M72 522l10 4v6c0 6 -4.5 9.5 -10 12c-5.5 -2.5 -10 -6 -10 -12v-6z" fill="none" stroke="#75efbd" stroke-width="3" stroke-linejoin="round"/>
<text x="95" y="532" fill="#b8ffe1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1">SECURITY RUNS ACROSS EVERY PHASE</text>
<text x="95" y="552" fill="#9fd8c4" font-family="Arial, Helvetica, sans-serif" font-size="13">Threat review while designing, dependency and config checks while shipping — never just a final gate.</text>
<path d="M240 505V484 M480 505V484 M720 505V484 M960 505V484 M1200 505V484 M1380 505V484" fill="none" stroke="#5be7b6" stroke-opacity=".35" stroke-width="2"/>
<rect x="60" y="610" width="18" height="18" rx="5" fill="#0f493f" stroke="#56e7af" stroke-width="1.5"/><text x="88" y="624" fill="#dce8f5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">HUMANS DECIDE</text><text x="88" y="642" fill="#9fb3c8" font-family="Arial, Helvetica, sans-serif" font-size="12">direction · approval · release</text>
<rect x="560" y="610" width="18" height="18" rx="5" fill="#14324a" stroke="#4de8f5" stroke-width="1.5"/><text x="588" y="624" fill="#dce8f5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">AGENTS ITERATE</text><text x="588" y="642" fill="#9fb3c8" font-family="Arial, Helvetica, sans-serif" font-size="12">build · test · refine inside the loop</text>
<path d="M1060 619h26" fill="none" stroke="#b08cff" stroke-width="3" class="flow"/><text x="1098" y="624" fill="#dce8f5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold">FEEDBACK &amp; LEARNING</text><text x="1098" y="642" fill="#9fb3c8" font-family="Arial, Helvetica, sans-serif" font-size="12">every return path is a loop, not a dead end</text>
</svg>
