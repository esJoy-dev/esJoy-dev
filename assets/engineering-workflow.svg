<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
<title id="title">How I Engineer Systems</title><desc id="desc">Six-stage engineering process: Explore, Architect, Implement, Verify, Secure, Release. Verification can return work to architecture or implementation. Release requires human approval.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071525"/><stop offset=".55" stop-color="#10233b"/><stop offset="1" stop-color="#141a34"/></linearGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#3a6683" stroke-opacity=".16" stroke-width="1"/></pattern>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28516b" stop-opacity=".76"/><stop offset=".48" stop-color="#1a314b" stop-opacity=".78"/><stop offset="1" stop-color="#262b53" stop-opacity=".86"/></linearGradient>
 <linearGradient id="mintglass" x2="1" y2="1"><stop stop-color="#12554f" stop-opacity=".9"/><stop offset="1" stop-color="#113e48" stop-opacity=".9"/></linearGradient>
 <linearGradient id="edge" x2="1" y2="0"><stop stop-color="#4fe4f6"/><stop offset="1" stop-color="#a98bff"/></linearGradient>
 <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
 <marker id="cyanArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#4de8f5"/></marker>
 <marker id="violetArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#b08cff"/></marker>
</defs>
<rect x="5" y="5" width="1490" height="830" rx="28" fill="url(#bg)" stroke="#32617f" stroke-width="2"/>
<rect x="8" y="8" width="1484" height="824" rx="26" fill="url(#grid)"/>
<path d="M48 46h65" stroke="#45e5f5" stroke-width="5"/><path d="M128 46h90" stroke="#49748f" stroke-width="2"/>
<text x="68" y="105" fill="#f1f7ff" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">How I Engineer Systems</text>
<text x="70" y="140" fill="#b5c7d8" font-family="Arial, Helvetica, sans-serif" font-size="19">Explore deeply. Build deliberately. Verify independently. Release with human oversight.</text>
<text x="1430" y="50" text-anchor="end" fill="#9fb5d6" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">BLUEPRINT / 02</text>

<path d="M463 304L518 304" fill="none" stroke="#4de8f5" stroke-width="3" marker-end="url(#cyanArrow)"/>
<path d="M973 304L1028 304" fill="none" stroke="#4de8f5" stroke-width="3" marker-end="url(#cyanArrow)"/>
<path d="M1254 400V460" stroke="#4de8f5" stroke-width="3" fill="none" marker-end="url(#cyanArrow)"/>
<path d="M1028 568L973 568" fill="none" stroke="#4de8f5" stroke-width="3" marker-end="url(#cyanArrow)"/>
<path d="M518 568L463 568" fill="none" stroke="#4de8f5" stroke-width="3" marker-end="url(#cyanArrow)"/>
<path d="M1178 460V433H877V402" fill="none" stroke="#b08cff" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#violetArrow)"/>
<path d="M790 434H650V402" fill="none" stroke="#b08cff" stroke-width="2.5" stroke-dasharray="9 8" marker-end="url(#violetArrow)"/>
<rect x="663" y="416" width="250" height="40" rx="20" fill="#1c2344" stroke="#b08cff" stroke-width="1.8"/><text x="788" y="442" text-anchor="middle" fill="#e5d8ff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold">ITERATE &amp; REFINE</text>
<rect x="70" y="205" width="420" height="195" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.8"/>
<path d="M88 207h160" stroke="#d9f9ff" stroke-opacity=".45" stroke-width="2"/>
<rect x="95" y="225" width="48" height="30" rx="9" fill="#1d6076" stroke="url(#edge)"/><text x="119" y="246" text-anchor="middle" fill="#e9faff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold">01</text>
<text x="98" y="295" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">EXPLORE</text>
<text x="98" y="327" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">Understand the problem,</text>
<text x="98" y="349" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">requirements, constraints,</text>
<text x="98" y="371" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">and available technologies.</text>
<circle cx="424" cy="259" r="17" fill="none" stroke="#5de8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M437 272l17 17" fill="none" stroke="#5de8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="540" y="205" width="420" height="195" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.8"/>
<path d="M558 207h160" stroke="#d9f9ff" stroke-opacity=".45" stroke-width="2"/>
<rect x="565" y="225" width="48" height="30" rx="9" fill="#1d6076" stroke="url(#edge)"/><text x="589" y="246" text-anchor="middle" fill="#e9faff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold">02</text>
<text x="568" y="295" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">ARCHITECT</text>
<text x="568" y="327" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">Design components,</text>
<text x="568" y="349" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">integrations, data flows,</text>
<text x="568" y="371" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">and operational boundaries.</text>
<path d="M877 254l28 -14 28 14 -28 14Z M877 266l28 14 28 -14 M877 278l28 14 28 -14" fill="none" stroke="#5de8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1010" y="205" width="420" height="195" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.8"/>
<path d="M1028 207h160" stroke="#d9f9ff" stroke-opacity=".45" stroke-width="2"/>
<rect x="1035" y="225" width="48" height="30" rx="9" fill="#1d6076" stroke="url(#edge)"/><text x="1059" y="246" text-anchor="middle" fill="#e9faff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold">03</text>
<text x="1038" y="295" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">IMPLEMENT</text>
<text x="1038" y="327" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">Build and connect the system</text>
<text x="1038" y="349" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">using technologies suited</text>
<text x="1038" y="371" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">to the problem.</text>
<path d="M1363 248L1348 266l15 18 M1387 248l15 18 -15 18 M1381 244L1369 288" fill="none" stroke="#5de8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1010" y="470" width="420" height="195" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.8"/>
<path d="M1028 472h160" stroke="#d9f9ff" stroke-opacity=".45" stroke-width="2"/>
<rect x="1035" y="490" width="48" height="30" rx="9" fill="#1d6076" stroke="url(#edge)"/><text x="1059" y="511" text-anchor="middle" fill="#e9faff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold">04</text>
<text x="1038" y="560" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">VERIFY</text>
<text x="1038" y="592" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">Test functionality, review</text>
<text x="1038" y="614" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">implementations, and</text>
<text x="1038" y="636" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">address discovered issues.</text>
<rect x="1348" y="508" width="54" height="50" rx="11" fill="none" stroke="#5de8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1359 532l11 10 21 -23" fill="none" stroke="#5de8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="540" y="470" width="420" height="195" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.8"/>
<path d="M558 472h160" stroke="#d9f9ff" stroke-opacity=".45" stroke-width="2"/>
<rect x="565" y="490" width="48" height="30" rx="9" fill="#1d6076" stroke="url(#edge)"/><text x="589" y="511" text-anchor="middle" fill="#e9faff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold">05</text>
<text x="568" y="560" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">SECURE</text>
<text x="568" y="592" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">Evaluate risks, dependencies,</text>
<text x="568" y="614" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">configuration, and</text>
<text x="568" y="636" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">deployment readiness.</text>
<path d="M905 504l26 11v18c0 17 -13 27 -26 32c-13 -5 -26 -15 -26 -32v-18z M893 534l9 9 16 -18" fill="none" stroke="#5de8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="70" y="470" width="420" height="195" rx="20" fill="url(#mintglass)" stroke="#56e7af" stroke-width="1.8"/>
<path d="M88 472h160" stroke="#d9f9ff" stroke-opacity=".45" stroke-width="2"/>
<rect x="95" y="490" width="48" height="30" rx="9" fill="#1d6076" stroke="#56e7af"/><text x="119" y="511" text-anchor="middle" fill="#e9faff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold">06</text>
<text x="98" y="560" fill="#f5f9ff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">RELEASE</text>
<text x="98" y="592" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">Review the final result and</text>
<text x="98" y="614" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">retain human control over</text>
<text x="98" y="636" fill="#d7e5f2" font-family="Arial, Helvetica, sans-serif" font-size="18">deployment decisions.</text>
<path d="M418 542C419 518 441 506 460 508C459 529 444 549 421 550Z M431 534a5 5 0 1 0 10 0a5 5 0 1 0 -10 0 M417 542l-9 13 16 -5 M440 552l-5 13 15 -9" fill="none" stroke="#75efbd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="226" y="649" width="256" height="38" rx="19" fill="#0f493f" stroke="#5be7b6" stroke-width="1.8"/><text x="354" y="674" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#b8ffe1">HUMAN APPROVAL REQUIRED</text>
<rect x="70" y="724" width="1360" height="78" rx="17" fill="#162b43" fill-opacity=".93" stroke="url(#edge)" stroke-width="1.5"/>
<text x="100" y="759" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#f0f7ff" letter-spacing="1">PROCESS PRINCIPLES</text>
<path d="M340 741V785" stroke="#55859f" stroke-width="1.5"/>
<text x="373" y="755" fill="#b9a5ff" font-family="Arial, Helvetica, sans-serif" font-size="22">∞</text><text x="411" y="756" fill="#dce8f5" font-family="Arial, Helvetica, sans-serif" font-size="16">Iterative</text><text x="411" y="776" fill="#b5c7d8" font-family="Arial, Helvetica, sans-serif" font-size="14">Not purely linear</text>
<text x="625" y="756" fill="#5be8f4" font-family="Arial, Helvetica, sans-serif" font-size="20">◆</text><text x="660" y="756" fill="#dce8f5" font-family="Arial, Helvetica, sans-serif" font-size="16">Security-aware</text><text x="660" y="776" fill="#b5c7d8" font-family="Arial, Helvetica, sans-serif" font-size="14">Throughout</text>
<text x="865" y="756" fill="#5be8f4" font-family="Arial, Helvetica, sans-serif" font-size="20">●</text><text x="901" y="756" fill="#dce8f5" font-family="Arial, Helvetica, sans-serif" font-size="16">Human-controlled</text><text x="901" y="776" fill="#b5c7d8" font-family="Arial, Helvetica, sans-serif" font-size="14">Release</text>
<text x="1150" y="756" fill="#5be8f4" font-family="Arial, Helvetica, sans-serif" font-size="20">◆</text><text x="1184" y="756" fill="#dce8f5" font-family="Arial, Helvetica, sans-serif" font-size="16">Maintainable</text><text x="1184" y="776" fill="#b5c7d8" font-family="Arial, Helvetica, sans-serif" font-size="14">Adaptable systems</text>
</svg>