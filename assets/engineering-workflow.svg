  @keyframes kC{0%,33.8%{opacity:0;stroke-dashoffset:20}34.4%{opacity:1}38.2%{opacity:1}39%{opacity:0;stroke-dashoffset:-65}73%{opacity:0;stroke-dashoffset:-65}73.2%{opacity:0;stroke-dashoffset:20}73.6%{opacity:1}75.9%{opacity:1}76.5%,100%{opacity:0;stroke-dashoffset:-65}}
  @keyframes kRW{0%,48.8%{opacity:0;stroke-dashoffset:26}49.6%{opacity:1}58%{opacity:1}58.8%,100%{opacity:0;stroke-dashoffset:-494}}
